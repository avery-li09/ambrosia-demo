<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Receptionist Demo</title><link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap' rel='stylesheet'><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#F5F5F0;background:#0A0A0A}.card{width:100%;max-width:440px;background:#141414;border:1px solid #1E1E1E;border-left:3px solid #C9A84C;padding:44px 36px;text-align:left}.kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#C9A84C;margin-bottom:16px}h1{font-family:'Playfair Display',serif;font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.5px;margin-bottom:10px}.bar{width:60px;height:3px;background:#C9A84C;margin:18px 0 22px}.sub{color:#8A8A82;font-size:15px;line-height:1.6;margin-bottom:30px}#btn{appearance:none;border:0;cursor:pointer;width:100%;padding:17px 20px;font-size:15px;font-weight:600;letter-spacing:.02em;color:#0A0A0A;background:#C9A84C;transition:background .2s ease}#btn:hover{background:#E8D5A3}#btn.live{background:#7A6430;color:#F5F5F0}.status{margin-top:16px;font-size:13px;color:#8A8A82;min-height:18px}.foot{margin-top:30px;padding-top:20px;border-top:1px solid #1E1E1E;font-size:12px;color:#8A8A82}.foot b{font-family:'Playfair Display',serif;font-weight:600;color:#F5F5F0;font-size:14px}.pulse{animation:p 2.4s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(201,168,76,.45)}70%{box-shadow:0 0 0 16px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}</style></head><body><main class='card'><p class='kicker'>Live demo · built for</p><h1 id='bizname'>your business</h1><div class='bar'></div><p class='sub'>This is the receptionist that picks up when your team is on a job. Tap below and talk to it like a customer would — ask about a burst pipe or a quote.</p><button id='btn' class='pulse'>Call your receptionist</button><p id='status' class='status'>Tap to start · your mic will be used</p><p class='foot'><b>Ambrosia AI</b><br>Demo line for <span id='cityname'>your city</span> — not your real number.</p></main><script type='module'>import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk@2';const P=new URLSearchParams(location.search);const biz=P.get('biz')||'your business';const city=P.get('city')||'Calgary';const owner=P.get('owner')||'there';const N8N='https://n8n.ambrosia-ai.org';const TURL=N8N+'/webhook/plumbing-demo-token?biz='+encodeURIComponent(biz)+'&city='+encodeURIComponent(city)+'&owner='+encodeURIComponent(owner);document.getElementById('bizname').textContent=biz;document.getElementById('cityname').textContent=city;document.title=biz+' — Receptionist Demo';const c=new RetellWebClient();const btn=document.getElementById('btn');const st=document.getElementById('status');let live=false;c.on('call_started',function(){live=true;btn.textContent='End call';btn.classList.add('live');btn.classList.remove('pulse');st.textContent='Connected — go ahead and talk';});c.on('call_ended',function(){live=false;btn.textContent='Call your receptionist';btn.classList.remove('live');btn.classList.add('pulse');st.textContent='Call ended · tap to try again';});c.on('error',function(){live=false;st.textContent='Something went wrong · tap to retry';btn.classList.remove('live');btn.classList.add('pulse');});btn.addEventListener('click',async function(){if(live){c.stopCall();return;}st.textContent='Allow the mic to start…';let probe;try{probe=await navigator.mediaDevices.getUserMedia({audio:true});}catch(err){st.textContent='Tap “allow” for the microphone, then try again';return;}try{probe.getTracks().forEach(function(t){t.stop();});}catch(e){}st.textContent='Connecting…';try{const r=await fetch(TURL);const d=await r.json();if(!d||!d.access_token){st.textContent='Could not start the demo · try again';return;}await c.startCall({accessToken:d.access_token});}catch(e){st.textContent='Could not start the demo · try again';}});</script></body></html>
